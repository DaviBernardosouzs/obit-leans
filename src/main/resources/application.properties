spring.application.name=OrbitLens
server.port=8081

nasa.gibs.base-url=https://gibs.earthdata.nasa.gov
celestrak.base-url=https://celestrak.org
nominatim.base-url=https://nominatim.openstreetmap.org
nominatim.user-agent=${NOMINATIM_USER_AGENT:OrbitLens/1.0}

http.connect-timeout=5s
http.read-timeout=15s
imagery.max-dimension=2048
imagery.bounding-box-radius-degrees=0.15
passes.max-hours=168

spring.cache.type=caffeine
spring.cache.cache-names=celestrak
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=2h
